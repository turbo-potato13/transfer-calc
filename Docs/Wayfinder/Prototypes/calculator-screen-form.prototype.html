<title>Четыре экрана калькулятора</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme: light dark;
  --ground:#EEF1F4; --surface:#FFFFFF; --surface-2:#F4F7F9; --surface-3:#E9EEF2;
  --ink:#0E1720; --ink-2:#3F5160; --muted:#6C7D8B;
  --line:#DCE3E9; --line-strong:#C0CCD5;
  --accent:#0B6A78; --accent-ink:#0B6A78; --accent-soft:#E0EFF1;
  --loss:#A93B2C; --loss-soft:#F8E7E4; --ideal:#436E52;
  --b1:#0B6A78; --b2:#94A3AE; --b3:#C0763A; --b4:#A93B2C;
  --bar-track:#E7ECF0;
  --shadow:0 1px 2px rgba(8,22,32,.09), 0 14px 38px rgba(8,22,32,.13);
  --sans:'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --mono:'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0C1218; --surface:#141C24; --surface-2:#1A232C; --surface-3:#212C36;
    --ink:#E3EAF1; --ink-2:#AEC0CD; --muted:#8496A4;
    --line:#25313B; --line-strong:#35454F;
    --accent:#3FB3C2; --accent-ink:#5FC6D3; --accent-soft:#0F343B;
    --loss:#E58272; --loss-soft:#3A1E1A; --ideal:#82B694;
    --b1:#3FB3C2; --b2:#7E8D99; --b3:#D9954F; --b4:#E07A66;
    --bar-track:#222D37;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 38px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --ground:#0C1218; --surface:#141C24; --surface-2:#1A232C; --surface-3:#212C36;
  --ink:#E3EAF1; --ink-2:#AEC0CD; --muted:#8496A4;
  --line:#25313B; --line-strong:#35454F;
  --accent:#3FB3C2; --accent-ink:#5FC6D3; --accent-soft:#0F343B;
  --loss:#E58272; --loss-soft:#3A1E1A; --ideal:#82B694;
  --b1:#3FB3C2; --b2:#7E8D99; --b3:#D9954F; --b4:#E07A66;
  --bar-track:#222D37;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 14px 38px rgba(0,0,0,.45);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--sans); font-size:15px; line-height:1.45;
  display:flex; flex-direction:column; align-items:center;
  padding:22px 12px 104px; min-height:100vh;
  -webkit-text-size-adjust:100%;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

/* ---------- phone shell (frame only, not part of the design under test) ---------- */
.phone{
  width:100%; max-width:390px; background:var(--surface);
  border:1px solid var(--line); border-radius:24px; overflow:hidden; box-shadow:var(--shadow);
}
.appbar{
  display:flex; align-items:baseline; justify-content:space-between; gap:10px;
  padding:11px 14px; border-bottom:1px solid var(--line); background:var(--surface-2);
}
.appbar b{font-size:13px; font-weight:600; letter-spacing:.01em}
.chain{font-family:var(--mono); font-size:10px; color:var(--muted); letter-spacing:.02em; white-space:nowrap}
@media (max-width:439px){
  body{padding:0 0 100px}
  .phone{max-width:none; border-radius:0; border:0; border-bottom:1px solid var(--line); box-shadow:none}
}

/* ---------- shared primitives ---------- */
.eyebrow{font-size:10.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.hint{font-size:10.5px; color:var(--muted)}
.lbl{display:block; font-size:12px; color:var(--ink-2); margin-bottom:5px}
.num{
  font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:15px; font-weight:500;
  color:var(--accent-ink); background:var(--surface); border:1px solid var(--line-strong);
  border-radius:8px; padding:7px 9px; width:100%; min-width:0;
  -moz-appearance:textfield;
}
.num:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); outline:none}
.sub{margin:0; font-size:12px; color:var(--muted)}
.sub b{color:var(--ink-2); font-weight:600; font-family:var(--mono); font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono); font-variant-numeric:tabular-nums}
.pill-loss{
  font-family:var(--mono); font-size:12px; font-weight:600; color:var(--loss);
  background:var(--loss-soft); border-radius:999px; padding:2px 7px; white-space:nowrap;
}
details > summary{cursor:pointer; list-style:none}
details > summary::-webkit-details-marker{display:none}
.chev{display:inline-block; transition:transform .15s ease; color:var(--muted); font-size:11px}
details[open] > summary .chev{transform:rotate(90deg)}
@media (prefers-reduced-motion:reduce){ *{transition:none !important; animation:none !important} }

/* loss breakdown bars — shared data-display, colour encodes who took the money */
.brk{display:flex; flex-direction:column; gap:7px}
.brk-row{display:grid; grid-template-columns:1fr auto; gap:2px 8px; align-items:baseline}
.brk-name{font-size:11.5px; color:var(--ink-2)}
.brk-val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:12px; font-weight:500}
.brk-bar{grid-column:1 / -1; height:5px; border-radius:3px; background:var(--bar-track); overflow:hidden}
.brk-bar > i{display:block; height:100%; border-radius:3px}
.brk-total{
  display:flex; justify-content:space-between; align-items:baseline;
  border-top:1px solid var(--line); padding-top:7px; margin-top:1px;
  font-size:11.5px; color:var(--ink-2)
}
.brk-total b{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:13px; color:var(--loss)}
.legend{font-size:10.5px; color:var(--muted); margin:2px 0 0}

/* ================= A — Лента: горячие курсы наверху, три валюты сразу ================= */
.va{display:flex; flex-direction:column}
.va > section{padding:14px; border-bottom:1px solid var(--line)}
.va-amount{background:var(--surface)}
.bigin{display:flex; align-items:baseline; gap:8px; margin-bottom:7px}
.bigin input{
  font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:30px; font-weight:600;
  letter-spacing:-.01em; color:var(--ink); background:transparent; border:0; border-bottom:2px solid var(--accent);
  padding:2px 0 4px; width:100%; min-width:0;
}
.bigin input:focus{outline:none; background:var(--accent-soft)}
.bigin .unit{font-size:20px; color:var(--muted); font-family:var(--mono)}
.va-rates{background:var(--surface-2)}
.va-rates-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:9px}
.va-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.va-grid .num{min-height:44px; padding:10px 9px; font-size:16px}
.va-grid label{display:block; font-size:11px; color:var(--ink-2)}
.va-grid label span{display:block; margin-bottom:4px}
.va-res{padding:0 !important}
.va-row{border-bottom:1px solid var(--line)}
.va-row:last-child{border-bottom:0}
.va-row > summary{display:grid; grid-template-columns:26px 1fr auto; align-items:center; gap:10px; padding:11px 14px}
.va-row > summary:hover{background:var(--surface-2)}
.va-sym{font-family:var(--mono); font-size:17px; color:var(--muted); text-align:center}
.va-amt{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:21px; font-weight:600; letter-spacing:-.01em}
.va-eff{font-size:10.5px; color:var(--muted); font-family:var(--mono)}
.va-right{display:flex; flex-direction:column; align-items:flex-end; gap:3px}
.va-body{padding:2px 14px 14px 50px}
.va-more{padding:0 !important}
.va-more > details{border-bottom:1px solid var(--line)}
.va-more > details:last-child{border-bottom:0}
.va-more summary{padding:12px 14px; font-size:13px; color:var(--ink-2); display:flex; gap:8px; align-items:center}
.va-more summary:hover{background:var(--surface-2)}
.va-more .inner{padding:0 14px 14px}
.va-off{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}
.va-off label{font-size:10.5px; color:var(--ink-2)}
.va-off label span{display:block; margin-bottom:4px}
.va-off .num{font-size:12.5px; padding:6px 7px}
.va-off .full{grid-column:1 / -1}
.va-rev{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin-bottom:10px}
.va-rev label{font-size:10.5px; color:var(--ink-2)}
.va-rev label span{display:block; margin-bottom:4px}
.va-rev .num{font-size:12.5px; padding:6px 7px}

/* ================= B — Одна валюта: вкладки несут сравнение, глубина по одной ================= */
.vb-tabs{display:grid; grid-template-columns:repeat(3,1fr); border-bottom:1px solid var(--line); background:var(--surface-2)}
.vb-tab{
  appearance:none; border:0; background:transparent; cursor:pointer;
  padding:10px 4px 9px; border-bottom:2.5px solid transparent; font-family:var(--sans);
  display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted);
}
.vb-tab .t-cur{font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; font-weight:600}
.vb-tab .t-val{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:14px; font-weight:600}
.vb-tab[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); background:var(--surface)}
.vb-hero{padding:18px 14px 15px; text-align:center; border-bottom:1px solid var(--line)}
.vb-big{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:40px; font-weight:600; letter-spacing:-.025em; line-height:1.05}
.vb-big span{font-size:23px; color:var(--muted); margin-left:4px}
.vb-meta{display:flex; justify-content:center; gap:15px; margin-top:9px; font-size:11.5px; color:var(--muted)}
.vb-meta b{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink-2); font-weight:600}
.vb-dir{display:flex; border:1px solid var(--line-strong); border-radius:8px; overflow:hidden; margin-bottom:11px}
.vb-dir button{
  flex:1; appearance:none; border:0; background:var(--surface); cursor:pointer;
  font-family:var(--sans); font-size:11.5px; color:var(--muted); padding:7px 4px;
}
.vb-dir button[aria-pressed="true"]{background:var(--accent-soft); color:var(--accent-ink); font-weight:600}
.vb-sec{padding:13px 14px; border-bottom:1px solid var(--line)}
.vb-sec:last-child{border-bottom:0}
.vb-rates{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:10px}
.vb-rates label{font-size:11px; color:var(--ink-2)}
.vb-rates label span{display:block; margin-bottom:4px}
.vb-rates .num{font-size:13px; padding:6px 8px}
.vb-cold .num{color:var(--ink-2)}

/* ================= C — Таблица: Excel как есть, всё видно, ноль нажатий ================= */
.vc{font-size:12.5px}
.vc > section{padding:12px 12px 14px; border-bottom:1px solid var(--line)}
.vc h3{margin:0 0 9px; font-size:10.5px; font-weight:600; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.vc table{width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums}
.vc th, .vc td{padding:4.5px 3px; text-align:right; font-weight:400; white-space:nowrap}
.vc th:first-child, .vc td:first-child{text-align:left; white-space:normal; color:var(--ink-2); font-size:11.5px; padding-right:6px; line-height:1.25}
.vc thead th{font-family:var(--sans); font-size:10.5px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); border-bottom:1px solid var(--line-strong); padding-bottom:6px}
.vc tbody td:not(:first-child){font-family:var(--mono)}
.vc .r-main td:not(:first-child){font-size:15px; font-weight:600}
.vc .r-main td:first-child{font-weight:600; color:var(--ink)}
.vc .r-loss td:not(:first-child){color:var(--loss)}
.vc .r-sum td{border-top:1px solid var(--line-strong); padding-top:6px; font-weight:600}
.vc .r-sum td:not(:first-child){color:var(--loss)}
.vc .r-chk td{font-size:10.5px; color:var(--muted); padding-top:3px}
.vc tbody tr:not(.r-sum):not(.r-chk) td{border-bottom:1px solid var(--line)}
.vc .swatch{display:inline-block; width:7px; height:7px; border-radius:2px; margin-right:5px}
.vc .num{font-size:12px; padding:4px 5px; text-align:right}
.vc .in-row{display:grid; grid-template-columns:minmax(66px,1fr) repeat(3, minmax(0,1fr)); gap:5px; align-items:center; margin-bottom:6px}
.vc .in-row > span{font-size:11px; color:var(--ink-2)}
.vc .in-head > span{font-size:10px; letter-spacing:.05em; text-transform:uppercase; color:var(--muted); text-align:right}
.vc .in-head > span:first-child{text-align:left}

/* ================= D — Касса: сначала табло, потом одно число ================= */
.vd > section{padding:14px; border-bottom:1px solid var(--line)}
.vd-board{background:var(--surface-2)}
.vd-board .eyebrow{display:block; margin-bottom:11px}
.vd-field{margin-bottom:12px}
.vd-field:last-child{margin-bottom:0}
.vd-field > span{display:block; font-size:12px; color:var(--ink-2); margin-bottom:5px}
.vd-field .num{font-size:24px; font-weight:600; padding:11px 12px; text-align:center; letter-spacing:-.01em}
.vd-pick{display:grid; grid-template-columns:repeat(3,1fr); gap:7px; margin-bottom:7px}
.vd-pick button{
  appearance:none; cursor:pointer; font-family:var(--mono); font-size:16px; font-weight:600;
  padding:9px 0; border-radius:8px; border:1px solid var(--line-strong);
  background:var(--surface); color:var(--muted);
}
.vd-pick button[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#FFFFFF}
:root[data-theme="dark"] .vd-pick button[aria-pressed="true"]{color:#08181C}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .vd-pick button[aria-pressed="true"]{color:#08181C} }
.vd-out{padding:22px 14px 18px; text-align:center}
.vd-huge{font-family:var(--mono); font-variant-numeric:tabular-nums; font-size:48px; font-weight:600; line-height:1; letter-spacing:-.03em}
.vd-huge span{font-size:24px; color:var(--muted); margin-left:5px}
.vd-lines{margin-top:15px; display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted)}
.vd-lines b{font-family:var(--mono); font-variant-numeric:tabular-nums; color:var(--ink-2); font-weight:600}
.vd-other{
  display:flex; justify-content:center; gap:16px; padding-top:13px; margin-top:15px;
  border-top:1px solid var(--line); font-family:var(--mono); font-size:12.5px; color:var(--muted)
}
.vd-more > details{border-bottom:1px solid var(--line)}
.vd-more summary{padding:12px 14px; font-size:13px; color:var(--ink-2); display:flex; gap:8px; align-items:center}
.vd-more .inner{padding:0 14px 14px}

/* ================= switcher — deliberately not part of the design under test ================= */
.switch{
  position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:50;
  display:flex; align-items:center; gap:2px;
  background:#0E1720; color:#E8EFF4; border-radius:999px; padding:5px 6px;
  box-shadow:0 6px 24px rgba(8,22,32,.4); border:1px solid rgba(255,255,255,.14);
  max-width:calc(100vw - 20px);
}
:root[data-theme="dark"] .switch{background:#242F39}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .switch{background:#242F39} }
.switch button{
  appearance:none; border:0; background:transparent; color:inherit; cursor:pointer;
  font-size:16px; line-height:1; padding:7px 11px; border-radius:999px; font-family:var(--sans);
}
.switch button:hover{background:rgba(255,255,255,.13)}
.switch .who{
  font-family:var(--sans); font-size:12px; padding:0 8px; text-align:center; min-width:138px;
  display:flex; flex-direction:column; gap:1px;
}
.switch .who b{font-weight:600; letter-spacing:.01em}
.switch .who i{font-style:normal; font-size:9.5px; opacity:.65; font-family:var(--mono)}
.note{
  max-width:390px; width:100%; margin:14px auto 0; font-size:11.5px; line-height:1.5;
  color:var(--muted); text-align:center;
}
.note code{font-family:var(--mono); font-size:11px; color:var(--ink-2)}
</style>

<div class="phone">
  <div class="appbar">
    <b>Вывод денег</b>
    <span class="chain">₽ карта РФ → Юнистрим → касса ПМР → €</span>
  </div>
  <div id="app"></div>
</div>

<p class="note">Прототип к тикету «Форма экрана калькулятора». Курсы и формулы — из <code>Калькулятор перевода.xlsx</code>, проверка сходимости внизу.</p>

<div class="switch" role="group" aria-label="Переключатель вариантов">
  <button id="prev" aria-label="Предыдущий вариант">←</button>
  <span class="who"><b id="who-name">A — Лента</b><i id="who-check">сходимость 0,00 ₽</i></span>
  <button id="next" aria-label="Следующий вариант">→</button>
</div>

<script>
(function(){
"use strict";

/* Прототип к тикету «Форма экрана калькулятора».
   Четыре варианта раскладки на одном экране, переключение через ?variant=A..D.
   Формулы — построчный перенос из «Калькулятор перевода.xlsx», разделы 2–4.
   Выбрасывается после того, как вариант выбран. */

var C = {
  EUR: {name:'Евро',   sym:'€',   sale:19.6,  prb:18.6631, nbm:20.0216, want:500},
  MDL: {name:'Лей',    sym:'лей', sale:1,     prb:0.9299,  nbm:1,       want:10000},
  USD: {name:'Доллар', sym:'$',   sale:16.35, prb:16.1,    nbm:17.3048, want:500}
};
var CODES = ['EUR','MDL','USD'];
var S = { amount:50000, feePct:1, feeMin:50, buyRub:0.177, prbRub:0.1823, nbmRub:0.1993, cur:'EUR', dir:'fwd' };

/* ---------- формат ---------- */
function fmt(v,max,min){
  if(!isFinite(v)) return '—';
  return new Intl.NumberFormat('ru-RU',{maximumFractionDigits:max, minimumFractionDigits:min||0}).format(v);
}
function rub(v){ return fmt(v,0); }
function mon(v){ return fmt(v,2); }
function pct(v){ return fmt(v*100,1)+'%'; }
function rate(v){ return fmt(v,4); }
function parseNum(s){
  var x = parseFloat(String(s).replace(/[\s ]/g,'').replace(',','.'));
  return isFinite(x) ? x : 0;
}

/* ---------- расчёт: строки 19–28 и 34–38 листа «Калькулятор» ---------- */
function calc(code){
  var c = C[code];
  var fee   = Math.max(S.amount * S.feePct/100, S.feeMin);   // B19
  var total = S.amount + fee;                                 // B20
  var pmr   = S.amount * S.buyRub;                            // B21
  var get   = c.sale ? pmr / c.sale : 0;                      // B24
  var ideal = c.nbm  ? total * S.nbmRub / c.nbm : 0;          // B25
  var k     = S.nbmRub ? c.nbm / S.nbmRub : 0;                // валюта -> ₽ по НБМ
  var lossCur = ideal - get;                                  // B26
  var lossRub = lossCur * k;                                  // B27
  var lossPct = ideal ? lossCur / ideal : 0;                  // B28
  var eff     = get ? total / get : 0;                        // B29
  var s1 = fee;                                                                        // B34
  var s2 = (c.nbm && c.prb) ? (S.amount*S.nbmRub/c.nbm - S.amount*S.prbRub/c.prb)*k : 0; // B35
  var s3 = c.prb ? S.amount*(S.prbRub - S.buyRub)/c.prb*k : 0;                          // B36
  var s4 = (c.prb && c.sale) ? (pmr/c.prb - pmr/c.sale)*k : 0;                          // B37
  var sum = s1+s2+s3+s4;                                                                // B38
  var rp    = c.want * c.sale;                                // B46
  var rcash = S.buyRub ? rp / S.buyRub : 0;                   // B47
  var rcard = rcash + Math.max(rcash*S.feePct/100, S.feeMin); // B48
  return {c:c,fee:fee,total:total,pmr:pmr,get:get,ideal:ideal,lossCur:lossCur,lossRub:lossRub,
          lossPct:lossPct,eff:eff,s1:s1,s2:s2,s3:s3,s4:s4,sum:sum,check:sum-lossRub,
          rp:rp,rcash:rcash,rcard:rcard};
}
function maxCheck(){
  var m = 0;
  for(var i=0;i<CODES.length;i++){ m = Math.max(m, Math.abs(calc(CODES[i]).check)); }
  return m;
}

/* ---------- разбор потери: общий блок данных для всех вариантов ---------- */
var STEPS = [
  ['Комиссия Юнистрима','var(--b1)'],
  ['Разрыв офиц. курсов ПРБ и НБМ','var(--b2)'],
  ['Спред банка на покупке ₽','var(--b3)'],
  ['Спред банка на продаже валюты','var(--b4)']
];
function brkHTML(code, legend){
  var rows = '';
  for(var i=0;i<STEPS.length;i++){
    rows += '<div class="brk-row">'+
      '<span class="brk-name">'+STEPS[i][0]+'</span>'+
      '<span class="brk-val" data-s="'+i+'"></span>'+
      '<span class="brk-bar"><i data-b="'+i+'" style="background:'+STEPS[i][1]+'"></i></span>'+
    '</div>';
  }
  return '<div class="brk" data-brk="'+code+'">'+rows+
    '<div class="brk-total"><span>Итого потеря против курса НБМ</span><b data-s="t"></b></div>'+
    (legend===false ? '' : '<p class="legend">Два тёплых столбика — спреды кассы. Серый — разрыв официальных курсов ПРБ и НБМ: он не чья-то комиссия, убрать его нельзя.</p>')+
  '</div>';
}
function fillBrk(root, code){
  var box = root.querySelector('[data-brk="'+code+'"]');
  if(!box) return;
  var r = calc(code), v = [r.s1,r.s2,r.s3,r.s4], mx = 0, i;
  for(i=0;i<v.length;i++){ mx = Math.max(mx, Math.abs(v[i])); }
  if(!mx) mx = 1;
  for(i=0;i<v.length;i++){
    box.querySelector('[data-s="'+i+'"]').textContent = rub(v[i])+' ₽';
    box.querySelector('[data-b="'+i+'"]').style.width = Math.max(0, Math.min(100, Math.abs(v[i])/mx*100))+'%';
  }
  box.querySelector('[data-s="t"]').textContent = rub(r.lossRub)+' ₽';
}

/* ---------- привязка полей ---------- */
function getK(k){ var p = k.split('.'); return p.length>1 ? C[p[0]][p[1]] : S[k]; }
function setK(k,v){ var p = k.split('.'); if(p.length>1){ C[p[0]][p[1]] = v; } else { S[k] = v; } }
function fmtFor(k,v){
  if(k==='amount' || k==='feeMin') return rub(v);
  if(k==='feePct') return fmt(v,2);
  if(k.indexOf('.want')>0) return fmt(v,2);
  return rate(v);
}
function bindInputs(root){
  var list = root.querySelectorAll('input[data-k]');
  for(var i=0;i<list.length;i++){
    (function(inp){
      var k = inp.getAttribute('data-k');
      inp.setAttribute('inputmode','decimal');
      inp.setAttribute('autocomplete','off');
      inp.value = fmtFor(k, getK(k));
      inp.addEventListener('input', function(){ setK(k, parseNum(inp.value)); update(); });
      inp.addEventListener('focus', function(){ inp.select(); });
      inp.addEventListener('blur',  function(){ inp.value = fmtFor(k, getK(k)); });
    })(list[i]);
  }
}

/* ================= переключатель ================= */
var VARIANTS = [['A',VA],['B',VB],['C',VC],['D',VD]];
var idx = 0, activeUpdate = function(){};
var app = document.getElementById('app');

function update(){
  activeUpdate();
  document.getElementById('who-check').textContent = 'сходимость ' + fmt(maxCheck(),2,2) + ' ₽';
}
function render(){
  var v = VARIANTS[idx][1];
  app.innerHTML = v.html();
  bindInputs(app);
  activeUpdate = v.wire(app);
  document.getElementById('who-name').textContent = VARIANTS[idx][0] + ' — ' + v.name;
  update();
}
function setParam(key){
  try{
    var u = new URL(location.href);
    u.searchParams.set('variant', key);
    history.replaceState(null, '', u.toString());
  }catch(e){
    try{ location.hash = key; }catch(e2){}
  }
}
function go(d){
  idx = (idx + d + VARIANTS.length) % VARIANTS.length;
  setParam(VARIANTS[idx][0]);
  render();
}
document.getElementById('prev').addEventListener('click', function(){ go(-1); });
document.getElementById('next').addEventListener('click', function(){ go(1); });
document.addEventListener('keydown', function(e){
  var t = e.target;
  if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.isContentEditable)) return;
  if(e.key==='ArrowLeft'){ go(-1); }
  else if(e.key==='ArrowRight'){ go(1); }
});

var want = null;
try{ want = new URL(location.href).searchParams.get('variant'); }catch(e){}
if(!want && location.hash){ want = location.hash.replace('#',''); }
if(want){
  for(var j=0;j<VARIANTS.length;j++){ if(VARIANTS[j][0] === want.toUpperCase()){ idx = j; } }
}
render();
})();
</script>
